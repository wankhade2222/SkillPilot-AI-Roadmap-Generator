spring.application.name=skillforge-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillforge}
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

frontend.url=${FRONTEND_URL:http://localhost:3000}

jwt.secret=${JWT_SECRET:Qm7x9K2ExampleLongRandomSecretGeneratedByPowerShell123456==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

gemini.api.key=${GEMINI_API_KEY}
gemini.api.keys=${GEMINI_API_KEYS:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}
gemini.fallback.enabled=true

openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
openrouter.model=${OPENROUTER_MODEL:openrouter/free}
